name: Device Agent Windows release

on:
  push:
    tags: ['device-agent-v*']
  # Retry against an existing tag, never publish an untagged branch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: device-agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tag, public repository and required secrets
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $missing = $false
          foreach ($name in @('WINDOWS_SIGNING_CERT_BASE64', 'WINDOWS_SIGNING_CERT_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host "${name}: NOT CONFIGURED"
              $missing = $true
            }
          }
          if ($missing) { throw 'WINDOWS CODE SIGNING FAILED: required secrets are missing.' }
          if ($env:REPOSITORY_IS_PRIVATE -ne 'false') { throw 'RELEASE FAILED: public installer assets require a public repository.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "device-agent-v$version") { throw 'RELEASE FAILED: tag must match package.json.' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: device-agent/package-lock.json
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'BUILD FAILED: Inno Setup installation failed.' }
      - name: Validate certificate, restore, build, sign and verify both executables
        id: build
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          DEVICE_AGENT_VERSION: ${{ github.ref_name }}
        run: ./installer/build-installer.ps1
      - name: Verify uploaded assets then publish official release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.build.outputs.release_dir }}
        run: ./installer/publish-release.ps1 -ReleaseDir $env:RELEASE_DIR
      - name: Remove temporary signing material
        if: always()
        run: ./installer/cleanup-signing.ps1
      - name: Report failure
        if: failure()
        run: |
          'RELEASE PIPELINE: FAILED. Inspect the failing step. Build/signature failures prevent publication; failures during the final public download check can occur after a verified release is already public.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
