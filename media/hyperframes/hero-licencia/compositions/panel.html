<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Panel en vivo</title></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; perspective: 1800px; }
        .pn-device { position: absolute; left: 170px; top: 110px; width: 860px; height: 560px; padding: 14px; border-radius: 26px; background: linear-gradient(180deg, #1d2a26, #0b1411); box-shadow: 0 50px 110px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18); }
        .pn-screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 14px; background: #fff; }
        .pn-video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
        .pn-chip { position: absolute; left: 680px; top: 560px; display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-size: 34px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; box-shadow: 0 24px 50px rgba(0,0,0,0.35); }
        .pn-dot { width: 14px; height: 14px; border-radius: 50%; background: #0e6b55; box-shadow: 0 0 0 5px rgba(14,107,85,0.25); }
      </style>
      <div id="root" data-composition-id="panel" data-width="1200" data-height="1200">
        <div id="pn-device" class="pn-device">
          <div class="pn-screen">
            <video id="pn-video" class="pn-video clip" src="assets/footage/panel.mp4" muted playsinline data-start="0" data-duration="4.4" data-media-start="0.2" data-playback-rate="1.6" data-track-index="0"></video>
          </div>
        </div>
        <div id="pn-chip" class="pn-chip"><span class="pn-dot"></span>30 órdenes en curso</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#pn-device", { opacity: 0, y: 70, rotateX: 10, rotateY: -8, scale: 0.94 }, { opacity: 1, y: 0, rotateX: 4, rotateY: -4, scale: 1, duration: 1.1, ease: "expo.out" }, 0.15)
          .to("#pn-device", { rotateX: 2, rotateY: 4, duration: 2.6, ease: "sine.inOut" }, 1.25)
          .fromTo("#pn-chip", { opacity: 0, scale: 0.6, rotate: -8 }, { opacity: 1, scale: 1, rotate: -4, duration: 0.6, ease: "back.out(2)" }, 1.4)
          .to(["#pn-device", "#pn-chip"], { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.5, ease: "power2.in" }, 3.85);
        window.__timelines["panel"] = tl;
      </script>
    </template>
  </body>
</html>
