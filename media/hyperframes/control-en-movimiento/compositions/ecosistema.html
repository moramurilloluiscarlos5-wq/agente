      <script>
        const tl = gsap.timeline({ paused: true });
        const CX = 960;
        const CY = 540;
        tl.fromTo("#eco-hub", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.15)
          .fromTo("#eco-ring", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1, ease: "power3.out" }, 0.4);
        for (let i = 0; i < 6; i++) {
          const line = document.getElementById(`eco-ln-${i}`);
          const x2 = line.x2.baseVal.value;
          const y2 = line.y2.baseVal.value;
          const len = Math.hypot(x2 - CX, y2 - CY);
          const t = 0.55 + i * 0.1;
          tl.fromTo(line, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, t)
            .fromTo(`#eco-mod-${i}`, { opacity: 0, x: (CX - x2) * 0.25, y: (CY - y2) * 0.25, scale: 0.9 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.8, ease: "expo.out" }, t + 0.35)
            // Pulsos de datos: del centro al módulo y de regreso.
            .fromTo(`#eco-pu-${i}`, { attr: { cx: CX, cy: CY }, opacity: 0 }, { attr: { cx: x2, cy: y2 }, opacity: 1, duration: 0.9, ease: "power1.inOut" }, 1.5 + i * 0.12)
            .to(`#eco-pu-${i}`, { opacity: 0, duration: 0.25 }, 2.4 + i * 0.12)
            .fromTo(`#eco-pu-${i}`, { attr: { cx: x2, cy: y2 }, opacity: 0 }, { attr: { cx: CX, cy: CY }, opacity: 0.9, duration: 0.8, ease: "power1.inOut", immediateRender: false }, 2.6 + i * 0.05)
            .to(`#eco-pu-${i}`, { opacity: 0, duration: 0.2, ease: "power1.in" }, 3.4)
            // 05 Cierre: los módulos vuelven al centro y todo se disuelve en el ambiente del primer cuadro.
            .to(`#eco-mod-${i}`, { opacity: 0, x: (CX - x2) * 0.6, y: (CY - y2) * 0.6, scale: 0.85, duration: 0.8, ease: "power2.in" }, 3.05 + i * 0.03)
            .to(line, { strokeDashoffset: len, duration: 0.7, ease: "power2.inOut" }, 3.0);
        }
        tl.to("#eco-ring", { opacity: 0, scale: 1.25, duration: 0.8, ease: "power1.out" }, 3.2)
          .to("#eco-hub", { opacity: 0, scale: 0.9, duration: 0.8, ease: "power2.in" }, 3.55);
        window.__timelines["ecosistema"] = tl;
